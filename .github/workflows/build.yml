name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unpack signing key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ runner.temp }}/release.jks"
          echo "KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and bundle
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FM-Radio-India-AK-signed-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: FM-Radio-India-AK-playstore-bundle
          path: app/build/outputs/bundle/release/*.aab